name: use_by_date
description: Local-first food expiry tracker with online AI analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  share_lib:
    path: ../../flutter_share_lib
  flutter_image_compress: ^2.4.0
  google_mobile_ads: ^8.0.0
  google_fonts: ^6.2.1
  gal: ^2.3.3
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dependency_overrides:
  google_mobile_ads: ^8.0.0
  share_plus: ^10.1.4
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
