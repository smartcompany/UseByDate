name: use_by_date
description: Local-first food expiry tracker with online AI analysis.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.1.2
  photo_manager: ^3.8.0
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  share_lib:
    path: ../../flutter_share_lib
  flutter_image_compress: ^2.4.0
  google_mobile_ads: ^8.0.0
  google_fonts: ^6.2.1
  gal: ^2.3.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  permission_handler: ^13.0.1

dependency_overrides:
  google_mobile_ads: ^8.0.0
  share_plus: ^10.1.4
  sign_in_with_apple: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  background_image: assets/splash.png
  android_gravity: center
  ios_content_mode: scaleAspectFill
  android_12:
    color: "#FEE2B7"
    image: assets/app_icon.png
    icon_background_color: "#FEE2B7"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/app_icon.png
    - assets/splash.png
